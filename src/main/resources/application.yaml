spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dtrps}
    username: ${DB_USER:dtrps}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PORT:8080}