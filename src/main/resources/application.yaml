spring:
  config:
    # Optional local secrets (gitignored), e.g. CLOUDINARY_URL=cloudinary://key:secret@cloud
    import: optional:file:.env.local.local[.properties]

  # Defaults point at the team's shared DB on the server, so the app runs without any setup.
  # This DB also serves the live API. Set DB_URL, DB_USER and DB_PASSWORD to use another one.
  datasource:
    url: ${DB_URL:jdbc:postgresql://72.61.114.184:5433/dtrps}
    username: ${DB_USER:dtrps_team}
    password: ${DB_PASSWORD:f49f3ab926a3200c8c57748e7c7e187c3d1fdd8e928342eb}
    # Mỗi BE chỉ giữ ít kết nối để cả nhóm dùng chung DB không bị "too many clients"
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    # The default drops and recreates every unique constraint on each start, which would
    # lock tables in the shared DB whenever someone runs the app. This only adds missing ones.
    properties:
      hibernate.schema_update.unique_constraint_strategy: RECREATE_QUIETLY
    open-in-view: false

  # OTP emails (sign-up, password reset). Gmail: MAIL_USERNAME + an App Password (not the account
  # password) in .env.local. Without them the code is written to the log instead of sent.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  servlet:
    multipart:
      # The service rejects files over 5MB with a clear message; this only caps the raw request
      max-file-size: 10MB
      max-request-size: 10MB

  sql:
    init:
      mode: always

server:
  port: ${PORT:8080}

app:
  jwt:
    # Dev-only default. The server sets its own JWT_SECRET, so tokens signed with this one are rejected there.
    secret: ${JWT_SECRET:9f7f9de118532e5994d089e547420d2bf67a2ca560cbdee3a31e4cd2a8eb872d}
    issuer: dtrps
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
  auth:
    rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
    max-failed-logins: ${AUTH_MAX_FAILED_LOGINS:10}
    login-lock-duration: ${AUTH_LOGIN_LOCK_DURATION:15m}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:System Admin}
  # Image uploads (POST /api/uploads/images). Copy the value from Cloudinary > API Keys.
  # Blank disables uploads (the endpoint answers 503).
  cloudinary:
    url: ${CLOUDINARY_URL:}
    folder: ${CLOUDINARY_FOLDER:dtrps/places}
    avatar-folder: ${CLOUDINARY_AVATAR_FOLDER:dtrps/avatars}
  # Goong map services (/api/maps/*). The "API Key" from account.goong.io, server side only.
  # Blank disables them (503). The web keeps the separate public Maptiles key.
  goong:
    api-key: ${GOONG_API_KEY:}
    base-url: ${GOONG_BASE_URL:https://rsapi.goong.io}
  # Google sign-in on the web: the OAuth Client ID (public). Blank turns Google sign-in off.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  # Email verification codes for sign-up and password reset
  otp:
    ttl: ${OTP_TTL:10m}
    resend-after: ${OTP_RESEND_AFTER:60s}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    # A verified code gives a one-time ticket to finish sign-up / set the new password
    ticket-ttl: ${OTP_TICKET_TTL:15m}
    from-name: SmartTravel
  # AI recommendation: OpenAI embeddings. Put OPENAI_API_KEY in .env.local.
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
